version: 2

models:
  - name: dim_account
    description: "{{ doc('docs_account') }}"
    columns:
      - name: account_id
        description: Account ID tests.
        data_type: integer
        tests:
          - not_null
          - unique
          - dbt_utils.expression_is_true:
              arguments:
                expression: " >= 0"
      - name: account_number
        description: Account number.
        data_type: string
        tests:
          - not_null
          - unique
