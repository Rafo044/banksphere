services:
  banksphere_minio:
    image: quay.io/minio/minio
    container_name: banksphere_minio
    env_file:
      - .env
    command: server /data
    ports:
      - "${MINIO_PORT}:9000"
    volumes:
      - ./minio:/data
    networks:
      - banksphere

  banksphere_citus:
    image: citusdata/citus:13.0
    container_name: banksphere_citus
    env_file:
      - .env
    ports:
      - "${CITUS_PORT}:5432"
    networks:
      - banksphere

