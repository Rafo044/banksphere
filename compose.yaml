#      - ./minio:/usr/app/minio # dbt lazım olarsa MinIO fayllarını oxuya bilər
#    working_dir: /usr/app/dbt_project
#    env_file:
#      - .env
#    networks:
#      - banksphere
#    depends_on:
#      - banksphere_minio
#      - banksphere_citus

  banksphere_duckdb:
    image: datacatering/duckdb:v1.3.2
    container_name: banksphere_duckdb
    volumes:
      - ./duckdb:/usr/app/duckdb
    env_file:
      - .env
#    depends_on:
#      - banksphere_minio
#      - banksphere_dbt
    ports: 
      - "${DUCKDB_PORT}:4213"
    networks:
      - banksphere
      

networks:
  banksphere:
    driver: bridge
